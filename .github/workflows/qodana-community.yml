name: Qodana Community

on:
  workflow_dispatch:
  pull_request:
    branches:
      - claude/new-session-b6um0m
  push:
    branches:
      - claude/new-session-b6um0m

permissions:
  contents: read

jobs:
  qodana-community:
    name: Qodana Community (YAML, JSON, Shell)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Community does not support JavaScript/TypeScript, so it is limited
      # to supported configuration and scripting files in this Next.js repo.
      - name: Run Qodana Community
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: --linter qodana-python-community --within-docker true
          upload-result: true
          pr-mode: false
          post-pr-comment: false
          use-annotations: false
